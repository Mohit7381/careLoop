# Journey #4 — Haloskin / Halofit treatment plans (frozen fixture 2026-09-04; see fixtures/digital_clinic/README.md)
name: digital_clinic
description: Digital clinic treatment plan — from a Haloskin or Halofit plan being created to the plan being paid for and activated

journey_keywords: [haloskin, halofit, "digital clinic", "digital clinics", treatment, treatments, "treatment plan", skincare, skin, diet, "weight loss", clinic, klinik, kulit, perawatan]

stages:
  - created        # a treatment plan exists for the user
  - confirmed      # the plan was paid for
  - activated      # the plan started

maturing_stages: [activated]   # a paid plan activates on its start date

drilldown_dimensions:
  - service_type
  - payer
  - initial_consultation
  - consultation_fee
  - hour_of_day
  - plan_type          # distribution only
  - expiry_reason      # distribution only

artifact_reasons:
