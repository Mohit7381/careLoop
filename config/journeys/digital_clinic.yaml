# Code Scout seeds — verified against GitLab blob search 2026-09-04 (counts in fixtures/digital_clinic/README.md)
code_hints:
  by_stage:
    digital_clinic:    [expire, treatment, activate, abandon]      # digital-clinic/treatment 50 / 50 / 50 / 50
    payments:          [payment, expiry]                            # 50 / 50
    re_engagement:     [reminder, notification]                     # 50 / 48
    consultation:      [consultation, erx]                          # 50 / 50
  by_dimension:
    payer:                [payment, expire]
    initial_consultation: [consultation, erx]
    consultation_fee:     [payment, consultation]
    plan_type:            [erx, treatment]
    expiry_reason:        [expire, expired, reminder]

default_routing: digital_clinic

routing:
  digital_clinic:
    - digital-clinic/treatment
    - digital-clinic/digital-clinic-catalog
  payments:
    - scrooge/payment-service
    - digital-clinic/treatment
  re_engagement:
    - transformers/garuda
    - digital-clinic/treatment
  consultation:
    - bintan/consultation

voc:
  app_id: com.linkdokter.halodoc.android
  lang: id
  country: id
  escalation_threshold: 20
  themes:
    - name: treatment/results
      routing_stage: digital_clinic
      search_terms: [treatment, activate]
      keywords: [hasil, "tidak ada perubahan", "tidak cocok", efek, kulit, berat, diet, program]
    - name: consultation/doctor
      routing_stage: consultation
      search_terms: [consultation, erx]
      keywords: [dokter, konsul, konsultasi, "lama membalas", resep, halofit, haloskin]
    - name: medicine/prescription
      routing_stage: digital_clinic
      search_terms: [erx, expire]
      keywords: [obat, resep, "resep expired", kadaluarsa, apotek]
    - name: payment/refund
      routing_stage: payments
      search_terms: [payment_failed, refund, abandon]
      keywords: [refund, pembayaran, bayar, "dana tidak", uang, tagihan]
    - name: app/technical
      routing_stage: digital_clinic
      search_terms: [error, crash, timeout]
      keywords: [error, aplikasi, login, otp, loading, crash, bug, update]
    - name: price
      routing_stage: payments
      search_terms: [pricing, fee]
      keywords: [mahal, harga, biaya, langganan]
  positive_themes:
    - name: visible_results
      routing_stage: digital_clinic
      keywords: [membaik, "ada perubahan", cocok, ampuh, berhasil]
    - name: great_doctor_experience
      routing_stage: consultation
      keywords: [ramah, membantu, jelas, sabar, profesional]
    - name: easy_program
      routing_stage: digital_clinic
      keywords: [mudah, praktis, simpel, gampang]
    - name: good_value
      routing_stage: payments
      keywords: [murah, worth, terjangkau]

stage_labels:
  created:   "had a treatment plan created"
  confirmed: "paid for the plan"
  activated: "started the plan"
dimension_labels:
  service_type:         "Haloskin or Halofit"
  payer:                "how they pay (cash or free)"
  initial_consultation: "whether the plan began with a doctor consultation"
  consultation_fee:     "whether that consultation was free or paid"
  hour_of_day:          "hour of the day"
  plan_type:            "what the plan contains"
  expiry_reason:        "why the plan lapsed"
