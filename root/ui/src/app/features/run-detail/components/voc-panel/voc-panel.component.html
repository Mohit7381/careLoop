@if (quotes().length) {
  <div class="usersay">
    <h3>Users say</h3>
    @for (q of quotes(); track q.text) {
      <div class="quote">
        <div class="qmeta mono">
          <div class="stars">{{ stars(q.rating) }}</div>
          {{ q.date }}
        </div>
        <div>
          <div class="qtext">&ldquo;{{ q.text }}&rdquo;</div>
          @if (q.gloss) {
            <div class="qgloss">{{ q.gloss }}</div>
          }
        </div>
      </div>
    }
  </div>
}
